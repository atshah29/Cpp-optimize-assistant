[project]
name = "cpp-optimize-assistant"
version = "0.2.0"
description = "A local-first, measured C++ source optimization assistant"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "groq>=0.30,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
ast = ["libclang>=18,<19"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
